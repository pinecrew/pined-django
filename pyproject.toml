[project]
name = "pined-django"
dynamic = ["version"]
description = "The missing pieces of Django, for perfectionists with deadlines"
readme = "README.md"
authors = [
    { name = "citrux", email = "369565@gmail.com" },
    { name = "illaech", email = "illaech@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "django",
    "settings",
    "pydantic",
    "management-commands",
    "migrations",
    "admin",
    "logging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "django>=5.2",
]

[project.urls]
Homepage = "https://github.com/pinecrew/pined-django"
Repository = "https://github.com/pinecrew/pined-django"
Issues = "https://github.com/pinecrew/pined-django/issues"

[project.optional-dependencies]
pydantic-field = [
    "pydantic>=2.13.4",
    "json-schema-to-pydantic>=0.4.11",
]
settings = [
    "dj-database-url>=3.1.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
# No `pydantic` here: both extras require it, so `uv sync` on its own is the
# install with neither — which is what `test-bare` needs.
#
# Pinned, unlike everything a project installs: the tools decide what a red
# build means, and a linter or a type checker that moved on its own turns
# every branch red at once for a reason no branch caused. What the package
# itself depends on stays a range — that is the promise, and `test (lowest
# direct)` is what holds it to it.
dev = [
    "django-stubs==6.1.0",
    "django-test-migrations==1.6.0",
    "poethepoet==0.48.0",
    "pyrefly==1.2.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "ruff==0.16.5",
]


[build-system]
# hatchling, for `hatch-vcs`: the version is whatever the tag says, and
# `uv_build` has no dynamic version to offer.
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
# `pined` is a namespace package — the distribution owns `pined.django` only.
packages = ["src/pined"]

[tool.hatch.build.targets.sdist]
# The package and its paperwork, as `uv_build` shipped. A source distribution
# is not a snapshot of the repository, which is what hatchling defaults to.
only-include = ["src", "README.md", "LICENSE"]


[tool.ruff]
line-length = 120
target-version = "py312"
output-format = "grouped"
show-fixes = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Markdown, because ruff 0.16 started formatting the python in it and the
# prose here does not want that: `CLAUDE.md`'s "Incorrect:" example is
# incorrect on purpose, and the README aligns trailing comments to be read
# rather than to be parsed.
exclude = ["urls.py", "*.md"]
docstring-code-line-length = 80

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "B", "BLE", "C4", "C90", "DJ", "E", "EM", "F", "FA",
    "FBT003", "G", "I", "INP", "INT", "ISC", "N", "PERF", "PGH004", "PIE",
    "PL", "PT", "PTH", "Q", "RET", "RSE", "RUF", "SIM", "T20", "TC", "TID",
    "UP", "W",
]
ignore = [
    "ANN002", "ANN003", "ANN401", "A005", "DJ012", "RUF001", "RUF002",
    "RUF003", "PLC2403", "RUF012", "ISC001", "PLC0415", "EM101",
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic values are the point of an assert
"tests/testapp/models.py" = ["DJ008"]  # nothing ever renders these
"tests/testapp/migrations/*" = ["N999"]  # 0001_initial is not a valid module name

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel",]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.conf"
# `tests.conf` is resolved before collection puts the repo on the path.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"


[tool.coverage.run]
source = ["src/pined/django"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# A ratchet, not a target: raise it when the number does.
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    # The "optional extra is not installed" path. Covered by the `bare` CI
    # cell, which runs `tests/no_pydantic` without a coverage report.
    "^\\s*except ImportError",
]


# Reports, and changes nothing. `fix` is the other half, and the two are kept
# apart on purpose: one task doing both meant the checking half ran `--fix-only`
# — which fixes rather than reports, and so exits 0 however much was wrong.
[tool.poe.tasks.lint]
sequence = [
    { cmd = "ruff format --check $target" },
    { cmd = "ruff check --no-fix $target" },
    { cmd = "pyrefly check" },
]
args = [{ name = "target", default = ".", positional = true, multiple = true }]
help = "Everything CI runs before the tests."

[tool.poe.tasks.fix]
sequence = [
    { cmd = "ruff format $target" },
    { cmd = "ruff check --fix $target ${unsafe:+--unsafe-fixes}" },
]
args = [
    { name = "unsafe", options = ["--unsafe-fixes", "--unsafe"], type = "boolean" },
    { name = "target", default = ".", positional = true, multiple = true }
]
help = "Reformats and applies what ruff can fix on its own."

[tool.poe.tasks]
test = "pytest"
cov = "pytest --cov --cov-report=term-missing --cov-report=xml"
# Wants `uv sync` rather than `uv sync --all-extras`; skips itself otherwise.
test-bare = "pytest tests/no_pydantic --ds=tests.conf_no_pydantic"


[tool.pyrefly]
# What ships, and the settings module the README documents. Not the tests:
# they poke at private django APIs and pass deliberately wrong arguments on
# purpose, and every one of those needs a suppression that says nothing a
# reader did not already know from the test's own name.
project-includes = ["src", "examples"]
# The repo root, so `examples` resolves the way `DJANGO_SETTINGS_MODULE` does.
search-path = ["."]
python-version = "3.12"
# Everything the default preset checks, plus annotation completeness, override
# validation and the implicit `Any`s.
preset = "strict"

[tool.pyrefly.errors]
# A part narrowing a field it inherited is how this library is used: a mixin
# declares `Unset[str]`, a project declares `str` and a value. Read-write
# attributes are not meant to narrow, and these do — deliberately, because a
# settings class is a record that is built once and read from thereafter.
bad-override-mutable-attribute = false
# `*args`/`**kwargs` forwarded to a django or pydantic base, which is the same
# call the ruff config declines to annotate through `ANN002` and `ANN003`.
# Ordinary parameters are still covered, by `ANN001` on ruff's side.
implicit-any-parameter = false
# Pyrefly does not read a lambda's parameter type off the call it is passed
# to, so this fires on every lambda there is — `["b", "a"].sort(key=lambda n:
# n.upper())` included. That is a ban on lambdas, not a finding.
implicit-any-lambda = false
