[project]
name = "pined-django"
version = "0.1.0"
description = "The missing pieces of Django, for perfectionists with deadlines"
readme = "README.md"
authors = [
    { name = "citrux", email = "369565@gmail.com" },
    { name = "illaech", email = "illaech@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "django",
    "settings",
    "pydantic",
    "management-commands",
    "migrations",
    "admin",
    "logging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "django>=5.2",
]

[project.urls]
Homepage = "https://github.com/pinecrew/pined-django"
Repository = "https://github.com/pinecrew/pined-django"
Issues = "https://github.com/pinecrew/pined-django/issues"

[project.optional-dependencies]
pydantic-field = [
    "pydantic>=2.13.4",
    "json-schema-to-pydantic>=0.4.11",
]
settings = [
    "dj-database-url>=3.1.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
# No `pydantic` here: both extras require it, so `uv sync` on its own is the
# install with neither — which is what `test-bare` needs.
dev = [
    "django-stubs>=6.0.5",
    "django-test-migrations>=1.6.0",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.21",
]


[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pined.django"


[tool.ruff]
line-length = 120
target-version = "py312"
output-format = "grouped"
show-fixes = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
exclude = ["urls.py"]
docstring-code-line-length = 80

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "B", "BLE", "C4", "C90", "DJ", "E", "EM", "F", "FA",
    "FBT003", "G", "I", "INP", "INT", "ISC", "N", "PERF", "PGH004", "PIE",
    "PL", "PT", "PTH", "Q", "RET", "RSE", "RUF", "SIM", "T20", "TC", "TID",
    "UP", "W",
]
ignore = [
    "ANN002", "ANN003", "ANN401", "A005", "DJ012", "RUF001", "RUF002",
    "RUF003", "PLC2403", "RUF012", "ISC001", "PLC0415", "EM101",
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic values are the point of an assert
"tests/testapp/models.py" = ["DJ008"]  # nothing ever renders these
"tests/testapp/migrations/*" = ["N999"]  # 0001_initial is not a valid module name

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel",]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.conf"
# `tests.conf` is resolved before collection puts the repo on the path.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"


[tool.coverage.run]
source = ["src/pined/django"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# A ratchet, not a target: raise it when the number does.
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    # The "optional extra is not installed" path. Covered by the `bare` CI
    # cell, which runs `tests/no_pydantic` without a coverage report.
    "^\\s*except ImportError",
]


[tool.poe.tasks.fix]
sequence = [
    { cmd = "ruff format ${check:+--check} $target", ignore_fail = true },
    { cmd = "ruff check $target ${check:+--no-show-fixes --fix-only} ${check:---fix} ${unsafe:+--unsafe-fixes}" },
]
args = [
    { name = "unsafe", options = ["--unsafe-fixes", "--unsafe"], type = "boolean" },
    { name = "check", options = ["--check"], type = "boolean" },
    { name = "target", default = ".", positional = true, multiple = true }
]

[tool.poe.tasks]
test = "pytest"
cov = "pytest --cov --cov-report=term-missing --cov-report=xml"
# Wants `uv sync` rather than `uv sync --all-extras`; skips itself otherwise.
test-bare = "pytest tests/no_pydantic --ds=tests.conf_no_pydantic"


[tool.pyright]
venv = ".venv"
venvPath = "."
reportUnusedCallResult = false


[tool.ty.environment]
root = ["."]
