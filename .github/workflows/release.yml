name: Release

on:
  push:
    # `v1.2.3`, and prereleases like `v1.2.3rc1`. The tag is the version.
    tags: ["v*"]

concurrency:
  # Not `cancel-in-progress`: an upload interrupted halfway leaves a release
  # half-published, and there is nothing to gain by racing a second run of the
  # same tag.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The whole matrix, on this exact tag. Nothing reaches PyPI otherwise.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: PyPI verifies this workflow's own identity, so
      # there is no token to keep anywhere. It also signs the attestations
      # uploaded alongside the files.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # `hatch-vcs` reads the version out of git, and the default shallow
          # clone arrives without the tag it would read.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      # No version to set: `pyproject.toml` declares it dynamic, and the build
      # takes it from the tag this run was started by.
      - run: uv build
      - name: The artifacts carry the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist/
          # A `dev` or `+local` version means the build could not see the tag —
          # a shallow clone, or a tree with changes in it — and would publish
          # something nobody asked for. PyPI rejects local versions outright.
          if ls dist/ | grep -qE 'dev[0-9]|\+'; then
            echo "::error::built a development version; the tag ${TAG} was not visible to the build"
            exit 1
          fi
      # `--check-url` skips a file the index already holds, so re-running a
      # partly-finished upload finishes it instead of failing on it.
      - name: Publish to PyPI
        run: >
          uv publish
          --trusted-publishing always
          --check-url https://pypi.org/simple/
