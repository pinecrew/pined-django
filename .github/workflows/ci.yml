name: CI

on:
  push:
    branches: [main]
  pull_request:
  # `release.yml` calls this before it publishes anything.
  workflow_call:

concurrency:
  # A literal prefix rather than `github.workflow`: called from another
  # workflow, that expands to the *caller's* name, which would put this run in
  # the same group as the run waiting on it — and cancel the one it belongs to.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
          # A key per job. Without one they share it, every job of a python
          # racing the others to save the same entry — eight
          # "unable to reserve cache" out of eleven, whenever the key is new.
          # It is new whenever `pyproject.toml` changes, which since the lock
          # stopped being tracked is what the key is taken over.
          cache-suffix: lint
      - run: uv sync --all-extras
      - run: uv run --no-sync poe lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        django: ["5.2", "6.0", "6.1"]
        # Marks the one cell that reports the coverage — a report per cell is
        # nine of the same thing. The newest of each, so the number describes
        # what the next release of either will be measured against. Adding a
        # version above is where you would move it.
        include:
          - python: "3.14"
            django: "6.1"
            coverage: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
          cache-suffix: ${{ matrix.django }}
      - run: uv sync --all-extras
      # Resolution takes the newest of everything the ranges allow; the matrix
      # wants one django in particular. `--upgrade-package` keeps it from
      # holding on to a patch older than the python in hand — django 5.2 only
      # supports 3.14 from 5.2.7 on.
      - name: Install django ${{ matrix.django }}
        run: uv pip install --upgrade-package django "django==${{ matrix.django }}.*"
      - name: The versions under test
        run: uv pip list
      - run: uv run --no-sync poe cov
      - name: Report coverage
        if: matrix.coverage
        uses: coverallsapp/github-action@v2
        with:
          # `poe cov` writes cobertura, which is not the action's default.
          file: ./coverage.xml
          format: cobertura
          # A cell whose tests passed is a cell that passed. Whether a
          # coverage service was reachable, or has heard of this repo yet,
          # is not the suite's verdict.
          fail-on-error: false

      # The same cell over again with neither extra installed, which is what a
      # bare `pined-django` has to keep working as: which command class comes
      # back, and what the import error says. `uv sync` with no `--all-extras`
      # prunes what the line above brought in — nothing in the dev group pulls
      # `pydantic` back in behind its back — and the django pin goes on again,
      # since the prune took the matrix's version with it.
      #
      # A job of its own until the lock stopped being tracked, and it could
      # only pick one python and one django to stand for the rest. Here it
      # runs against all nine, for the price of two `uv sync`s.
      - name: Install without the extras
        run: |
          uv sync
          uv pip install --upgrade-package django "django==${{ matrix.django }}.*"
      # `tests/no_pydantic` skips itself when pydantic is importable, so a leak
      # would read as a pass. Fail on it instead, before the tests run.
      - name: pydantic is really absent
        run: uv run --no-sync python -c "import importlib.util,sys; sys.exit(importlib.util.find_spec('pydantic') is not None)"
      - run: uv run --no-sync poe test-bare

  # The bottom of the declared ranges. Every cell above resolves the newest of
  # everything, so `django>=5.2`, `pydantic>=2.13.4` and the rest of the floors
  # are never the versions anything runs against — a dependency that quietly
  # needs a newer one than the metadata asks for would go unnoticed until
  # somebody installed the package for real.
  #
  # On the oldest python on purpose: `lowest-direct` resolves django 5.2.0,
  # and django only supports 3.14 from 5.2.7 on. Pairing the floors with the
  # newest python would test a combination nobody claims works.
  floors:
    name: test (lowest direct)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
          cache-suffix: lowest-direct
      - run: uv sync --all-extras --resolution lowest-direct
      - name: The versions under test
        run: uv pip list
      - run: uv run --no-sync poe test
